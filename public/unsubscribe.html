<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Unsubscribe — CA PRO Toolkit</title>
  <!-- DS25: the design system the admin panels wear, from this site. -->
  <link rel="stylesheet" href="/admin/capro-tokens.css?v=2" />
  <link rel="stylesheet" href="/admin/ui/capro-fonts.css?v=1" />
  <link rel="stylesheet" href="/admin/ui/capro-ui.css?v=1" />
  <link rel="stylesheet" href="/capro-public.css?v=1" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>
<body class="public-page">
  <main class="public-card" aria-live="polite">
    <div class="public-card__rule" aria-hidden="true"></div>
    <div class="public-card__body">
      <div class="public-brand">
        <span class="public-brand__mark"><img src="/admin/ui/capro-mark.png" alt="" width="26" height="26" /></span>
        <span class="public-brand__name">CA PRO Toolkit</span>
      </div>

      <div id="loading">
        <h1 class="public-title">Checking your link…</h1>
        <p class="public-lede">One moment.</p>
      </div>

      <div id="form" class="hidden">
        <h1 class="public-title">Unsubscribe</h1>
        <p class="public-lede" id="account-line"></p>
        <dl class="public-facts">
          <div><dt>Email</dt><dd id="email-value">—</dd></div>
          <div><dt>Digest</dt><dd id="kind-value">—</dd></div>
        </dl>
        <fieldset id="scope-fields" class="public-choices">
          <legend class="cp-visually-hidden">What to stop</legend>
          <label class="public-choice">
            <input type="radio" name="scope" value="THIS_KIND" checked />
            <span>
              Stop <span id="kind-inline">this</span> email only
              <span class="public-choice__desc">Other CA PRO Toolkit digest emails, if any, keep sending.</span>
            </span>
          </label>
          <label class="public-choice">
            <input type="radio" name="scope" value="ALL" />
            <span>
              Stop all digest emails
              <span class="public-choice__desc">Turns off email delivery for both the daily and weekly digest.</span>
            </span>
          </label>
        </fieldset>
        <button id="confirm-btn" class="cp-btn cp-btn--primary cp-btn--block" type="button">Unsubscribe</button>
      </div>

      <div id="result" class="hidden">
        <h1 class="public-title" id="result-title">Done</h1>
        <p class="public-lede" id="result-subtitle"></p>
      </div>

      <div id="error" class="hidden">
        <h1 class="public-title">This link isn't working</h1>
        <p class="public-lede" id="error-message">
          It may have expired or already been used. You can change your email preferences any time
          from inside CA PRO Toolkit under Settings.
        </p>
      </div>

      <div id="status" class="public-status" role="status"></div>
    </div>
  </main>

  <script src="/unsubscribe.js"></script>
</body>
</html>
