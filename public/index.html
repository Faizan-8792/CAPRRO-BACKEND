<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CA PRO Admin – Sign in</title>
  <!-- DS25: the design system the admin panels wear, served from this site. This page loaded
       Bootstrap from jsDelivr and a Google font, with a palette of its own. -->
  <link rel="stylesheet" href="/admin/capro-tokens.css?v=2" />
  <link rel="stylesheet" href="/admin/ui/capro-fonts.css?v=1" />
  <link rel="stylesheet" href="/admin/ui/capro-ui.css?v=1" />
  <link rel="stylesheet" href="/capro-public.css?v=1" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>
<body class="public-page">
  <main class="public-card" aria-labelledby="signInTitle">
    <div class="public-card__rule" aria-hidden="true"></div>
    <div class="public-card__body">
      <div class="public-brand">
        <span class="public-brand__mark"><img src="/admin/ui/capro-mark.png" alt="" width="26" height="26" /></span>
        <span class="public-brand__name">CA PRO Toolkit</span>
      </div>

      <h1 class="public-title" id="signInTitle">Sign in to the admin panel</h1>
      <p class="public-lede">We email you a one-time password (OTP). You stay signed in on this browser until you sign out.</p>

      <div class="public-field">
        <label class="cp-label" for="email">Email</label>
        <input id="email" type="email" class="cp-input" placeholder="you@yourfirm.in" autocomplete="email" />
      </div>

      <div class="public-actions">
        <button id="sendOtp" class="cp-btn cp-btn--primary" type="button">Send OTP</button>
        <button id="goVerify" class="cp-btn" type="button">I already have an OTP</button>
      </div>

      <div id="otpBlock" style="display:none; margin-top:16px;">
        <div class="public-field">
          <label class="cp-label" for="otp">OTP code</label>
          <input id="otp" type="text" class="cp-input cp-id" placeholder="6 digits" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <button id="verifyOtp" class="cp-btn cp-btn--primary cp-btn--block" type="button">Verify and sign in</button>
      </div>

      <div id="status" class="public-status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="./admin/login.js?v=5"></script>
</body>
</html>
